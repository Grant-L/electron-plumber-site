title = "Hamilton discovers quaternions on Brougham Bridge"
summary = "Walking along the Royal Canal in Dublin to a meeting of the Royal Irish Academy, William Rowan Hamilton saw how to multiply numbers in four parts, which he called quaternions: i squared = j squared = k squared = ijk = -1. He cut the formula into a stone of Brougham Bridge with a knife. He later told the story in an 1865 letter to his son."
oneliner = "Hamilton found how to multiply four-part numbers, quaternions, and cut the rule into a stone of a Dublin bridge."
