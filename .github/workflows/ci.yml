name: CI
# Pull requests only: a push to a PR branch already fires pull_request, so also listening to push ran the gate twice.
# main is covered by the Deploy workflow, which runs the same gate before it publishes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest "ruff==0.15.12"
      - run: ruff check .
      - run: python -m pytest -q
      - run: make check
        env:
          # Not available to pull requests from forks; check.py then warns and skips that one rule.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
      - uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site
          retention-days: 7
